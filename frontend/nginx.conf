server {
    listen 80;

    # Serve the React single-page app. try_files falls back to index.html so
    # client-side routing works (any unknown path loads the app).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend container. The trailing slash on proxy_pass
    # strips the "/api" prefix, so /api/chat -> backend's /chat. Because the
    # browser now talks to the SAME origin, there's no CORS issue in production.
    location /api/ {
        proxy_pass http://backend:8000/;
    }
}
